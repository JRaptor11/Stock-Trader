# Optional standalone Blueprint for the broker-free historical research API.
services:
  - type: web
    name: stock-trader-historical-research
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn research.app:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/public/uptime-health
    envVars:
      - key: SERVICE_MODE
        value: historical_research
      - key: BROKER_EXECUTION_ENABLED
        value: "false"
      - key: RESEARCH_API_TOKEN
        generateValue: true
      - key: RESEARCH_JOB_DIR
        value: /tmp/research/jobs
      - key: RESEARCH_DATA_DIR
        value: /tmp/research/data
      - key: RESEARCH_RESULTS_DIR
        value: /tmp/research/results
      - key: RESEARCH_MAX_QUEUED_JOBS
        value: "20"
      - key: RESEARCH_STATUS_UPLOAD_SECONDS
        value: "60"
      - key: RESEARCH_MAX_RETRIES
        value: "3"
      - key: RESEARCH_RETRY_BASE_SECONDS
        value: "30"
      - key: RESEARCH_RETRY_MAX_SECONDS
        value: "300"
      - key: RESEARCH_R2_STORAGE_BUDGET_BYTES
        value: "8589934592"
